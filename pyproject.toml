[project]
name = "glass-DL"
version = "0.0.1"
description = "glass_DL research repo that holds torch neural nets for creating LLR-head"
authors = [
    {name = "Netherlands Forensic Institute - CFS R&D Data", email = "cfs_rd_data@nfi.nl"},
]
dependencies = [
    "pre-commit>=4.3.0",
    "pymarkdownlnt>=0.9.32",
    "toml>=0.10.2",
    "confidence>=0.16.1",
    "filelock>=3.19.1",
    "fonttools>=4.59.2",
    "fsspec>=2025.9.0",
    "Jinja2>=3.1.6",
    "joblib>=1.5.2",
    "kiwisolver>=1.4.9",
    "lir>=0.1.29",
    "MarkupSafe>=3.0.2",
    "matplotlib>=3.10.6",
    "mpmath>=1.3.0",
    "networkx>=3.5",
    "numpy>=2.3.3",
    "pytest>=8.4.2",
    "PyYAML>=6.0.2",
    "scikit-learn==1.5.2",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.5",
    "sympy>=1.14.0",
    "threadpoolctl>=3.6.0",
    "tqdm>=4.67.1",
    "triton>=3.4.0",
    "typing-extensions>=4.15.0",
    "scipy>=1.16.2",
    "optuna>=4.5.0",
    "torch>=2.8.0",
    "torchvision>=0.23.0",
    "psycopg2-binary>=2.9.10",
    "pgvector>=0.4.1",
    "openpyxl>=3.1.5",
    "pydantic>=2.13.3",
]
requires-python = "==3.12.*"
readme = "README.md"
classifiers = [
    'Development Status :: 4 - Beta', # or other developement status see https://pypi.org/classifiers/
    'Environment :: Console',
    'Operating System :: MacOS :: MacOS X',
    'Operating System :: Microsoft :: Windows',
    'Operating System :: POSIX',
    'Programming Language :: Python :: 3.12',
    'License :: OSI Approved :: European Union Public Licence 1.2 (EUPL 1.2)'
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.13.0",
    "tox>=4.30.2",
    "pytest-cov>=7.0.0",
]

[tool.tox]
env_list = ["py312"]
skipsdist = true

[tool.tox.env_run_base]
passenv = ["PDM_PYPI_PASSWORD", "PDM_PYPI_USERNAME"]
allowlist_externals = ['pytest']
groups = ["dev"]
description = "Run test under {base_python}"
commands = [
    ["pytest", "tests/"]]

[tool.ruff]
line-length = 120
target-version = "py312"
# Ignore everything for notebooks
exclude = [
    "*.ipynb",
    "lib",
]

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint]
select = [
    "I", # isort
    "NPY", # numpy specific rules
    "UP", # pyupgrade
    "D", # pydocstyle
    "N", # pep8-naming
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "PL", # pylint
    "S",  # flake8-bandit
    "PT",  # flake8-pytest-style
]
ignore = [
    'D200',  # One-line docstring should fit on one line
    'D103',  # Missing docstring in public function
    'D102',  # Missing docstring in public method
    'D107',  # Missing docstring in `__init__`
    'D100',  # no module docstring required at top of each file
    'D101',  # no class docstring required (only in __init__)
    'D205',  # no blank line between summary and description of docstring required (we omit the summary often)
    'D104',  # no docstring in __init__.py of public package required
    'D105',  # no docstring in magic methods (like __eq__) required, since they are not class dependent
    'D212',  # no specific distinction between summary and description of a docstring (we omit the summary often)
    'N802',  # no restriction on casing of function names
    'N803',  # no restrictions on naming conventions and having uppercase variable names
    'N806',  # no restrictions on having uppercase argument names in a function
    'N999',  # no restrictions on naming of folders
    'NPY002', # i want to use np.random.choice due to legacy reasons
    'PLR0913',  # no restriction on having 5 or fewer arguments in a function
    'PLE0604',  # no restriction on having only strings in __all__ definitions
    'PLR0912', # no restriction on number of branches per function
    'PLR0915', # no restriction on number of statements per function
    'PLR2004',  # not restriction on using magic values (unspecified) as used a lot in the tests
    'S608',  # no check on SQL injection
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"  # docstring type to use
ignore-decorators = ["property"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = [
    "S101",  # Exclude the 'use of assert' warning in the test files
    "D103",  # No docstring necessary for tests
    "PT011",  # No `match` parameter necessary for pytest.raises
]

[tool.ruff.lint.flake8-pytest-style]
parametrize-names-type = "csv"  # allows the string style of pytest.mark.parametrize feature names

[tool.pdm]
distribution = false

[[tool.pdm.source]]
name = "pypi"
url = "https://repo.nfi.minjus.nl/repository/pip-group/simple"

[tool.pdm.scripts]
lrbenchmark.cmd = "python -m lrbenchmark.main"
lrbenchmark.env_file = ".env"

[tool.pytest.ini_options]
addopts = "--cov=DL_modules --cov-fail-under=42 --cov-report html:coverage --ignore=lib --ignore=archived_experiments"
